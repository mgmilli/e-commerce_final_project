<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Shakespearian Play poster</title>
  <desc id="desc">Elegant theater poster with gold and indigo lighting effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="50%" stop-color="#221c4f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <path d="M120 560C260 470 420 450 590 510C730 560 850 615 1090 540V800H120Z" fill="#020617" opacity="0.8"/>
  <circle cx="910" cy="190" r="180" fill="#f59e0b" opacity="0.14"/>
  <circle cx="300" cy="220" r="130" fill="#5eead4" opacity="0.1"/>
  <path d="M250 520L600 230L950 520" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.7"/>
  <text x="90" y="160" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">Shakespearian Play</text>
  <text x="90" y="230" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="28">Central Theater | May 20, 2026</text>
</svg>
