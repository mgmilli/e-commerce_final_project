<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Jazz Night Live poster</title>
  <desc id="desc">Stylized poster with warm lights and deep blue gradients for the jazz event.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#1f1724"/>
      <stop offset="100%" stop-color="#0f1720"/>
    </linearGradient>
    <linearGradient id="spot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd48a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="940" cy="130" r="190" fill="#f59e0b" opacity="0.12"/>
  <circle cx="280" cy="620" r="240" fill="#f97316" opacity="0.08"/>
  <path d="M120 580C290 480 430 470 600 530C770 590 910 595 1080 500V800H120Z" fill="#020617" opacity="0.75"/>
  <circle cx="330" cy="280" r="120" fill="url(#spot)" opacity="0.18"/>
  <circle cx="520" cy="210" r="84" fill="#ffd48a" opacity="0.12"/>
  <text x="90" y="160" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">Jazz Night Live</text>
  <text x="90" y="230" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="28">Downtown Arena | May 15, 2026</text>
</svg>
